name: tests
on:
  push:
    branches: [main, feature/python-production]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14', '3.15']
        weewx: ['5.5.2', '5.6.0']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest numpy 'weewx==${{ matrix.weewx }}'
      - run: python -m pytest -q
      - name: Build extension package
        run: python tools/package.py
      - name: Validate packaged extension
        run: python tools/validate_package.py
